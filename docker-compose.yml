services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_web
    ports:
      - "8080:80"
    volumes:
      - ./websites/as1/public:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: assignment1
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./websites/as1/database:/var/lib/mysql
      - ./websites/as1/docker/mysql:/docker-entrypoint-initdb.d  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db